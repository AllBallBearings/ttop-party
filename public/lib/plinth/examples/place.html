<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Plinth — Place &amp; Play</title>
  <style>
    :root { --fg: #f8fafc; --muted: #94a3b8; --panel: rgba(15, 23, 42, 0.72); --accent: #38bdf8; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 15px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
    .hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: max(12px, env(safe-area-inset-top)) 12px 8px; pointer-events: none; }
    .pill { pointer-events: auto; background: var(--panel); border-radius: 999px; padding: 8px 14px; display: flex; gap: 8px; align-items: center; backdrop-filter: blur(8px); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; }
    .dot.ok { background: #22c55e; }
    .dot.bad { background: #ef4444; }
    button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid rgba(255,255,255,0.15); border-radius: 999px; padding: 8px 14px; pointer-events: auto; }
    .spacer { flex: 1; }
    .hint { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel); padding: 10px 16px; border-radius: 14px; text-align: center; max-width: 86vw; }
    .start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #1e293b, #020617); z-index: 10; }
    .start .card { max-width: 340px; text-align: center; padding: 24px; }
    .start h1 { font-size: 26px; margin: 0 0 8px; }
    .start p { color: var(--muted); margin: 0 0 20px; }
    .start button { background: var(--accent); color: #0b1220; border: 0; font-weight: 700; padding: 14px 28px; font-size: 17px; }
    .hidden { display: none !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../../../vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="ar"></canvas>
  <div class="hud">
    <div class="pill"><span id="dot" class="dot"></span><span id="status">Starting…</span></div>
    <div class="spacer"></div>
    <button id="pointsBtn" type="button">Points</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <div id="hint" class="hint hidden">Point at a table or floor, then tap to place</div>
  <div id="start" class="start">
    <div class="card">
      <h1>Place &amp; Play</h1>
      <p>Markerless AR in the browser. Tap to place objects on a surface, hold to drag, pinch to scale, twist to rotate.</p>
      <button id="startBtn" type="button">Start AR</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { PlinthThree, createShadowCatcher, createDefaultLighting } from '../three/index.js';
    import { ObjectManipulator, PlacementReticle } from '../three/gestures.js';

    const $ = (id) => document.getElementById(id);
    // Scene units are metres if the assumed camera height is right; for a
    // phone held over a table ~0.45 m is typical (use ~1.3 for the floor).
    const ar = new PlinthThree({ canvas: $('ar'), cameraHeight: 0.45 });
    const lighting = createDefaultLighting({ shadowSize: 1 });
    ar.scene.add(lighting.group);

    function makeToy(hue) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.55), roughness: 0.35, metalness: 0.1 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.012, 32), new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.6 }));
      base.position.y = 0.006;
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.022, 0.04, 8, 24), mat);
      body.position.y = 0.045;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.02, 24, 16), mat);
      head.position.y = 0.092;
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.024, 0.008, 0.01), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
      visor.position.set(0, 0.095, 0.017);
      for (const m of [base, body, head, visor]) { m.castShadow = true; g.add(m); }
      g.add(createShadowCatcher(0.3, 0.4));
      return g;
    }

    let placed = 0;
    const reticle = new PlacementReticle(ar, {
      radius: 0.035,
      onPlace: ({ position, quaternion }) => {
        const anchor = ar.createAnchor(position.toArray(), quaternion.toArray());
        const toy = makeToy((placed++ * 0.17) % 1);
        toy.scale.setScalar(0.001);
        anchor.add(toy);
        // Pop-in animation, then make it manipulable.
        const t0 = performance.now();
        const grow = () => {
          const k = Math.min(1, (performance.now() - t0) / 350);
          toy.scale.setScalar(Math.max(0.001, 1 - Math.pow(1 - k, 3)));
          if (k < 1) requestAnimationFrame(grow);
          else new ObjectManipulator(ar, toy, { liftHeight: 0.03 });
        };
        grow();
        $('hint').textContent = 'Hold to drag · pinch to scale · twist to rotate';
      },
    });

    ar.engine.on('trackingstatus', ({ status, reason }) => {
      $('status').textContent = status === 'NORMAL' ? 'Tracking' : reason === 'RELOCALIZING' ? 'Finding surface…' : reason === 'INITIALIZING' ? 'Look at a surface' : 'Limited tracking';
      $('dot').className = 'dot ' + (status === 'NORMAL' ? 'ok' : reason === 'RELOCALIZING' ? 'bad' : '');
    });
    ar.engine.on('camerastatuschange', ({ status, error }) => {
      if (status === 'failed') $('status').textContent = `Camera unavailable: ${error?.message || error}`;
    });

    let showPoints = false;
    $('pointsBtn').onclick = () => { showPoints = !showPoints; ar.setShowFeaturePoints(showPoints); };
    $('resetBtn').onclick = () => {
      for (const obj of [...ar.anchorObjects.values()]) ar.removeAnchor(obj);
      ar.engine.recenter();
      placed = 0;
    };

    $('startBtn').onclick = async () => {
      $('start').classList.add('hidden');
      await ar.requestMotionPermission(); // iOS needs a user gesture
      try {
        await ar.start();
        $('hint').classList.remove('hidden');
      } catch (err) {
        $('status').textContent = `Could not start: ${err.message || err}`;
      }
    };

    ar.run(() => lighting.update(ar.lightScale));
    window.ar = ar;
  </script>
</body>
</html>

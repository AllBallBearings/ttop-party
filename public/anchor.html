<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabletop AR — Printable QR Anchor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: 0;
      background: #0ea5e9;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .btn.secondary {
      background: #334155;
    }
    .sheet {
      background: #ffffff;
      width: min(19cm, 95vw);
      padding: 28px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 14px;
      color: #475569;
      max-width: 460px;
    }
    .qr-frame {
      position: relative;
      padding: 18px;
      border: 4px solid #0f172a;
      border-radius: 12px;
      background: #ffffff;
    }
    .qr-box {
      width: 11cm;
      max-width: 68vw;
      aspect-ratio: 1;
    }
    .qr-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .footer-note {
      font-size: 12px;
      color: #64748b;
    }
    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .toolbar {
        display: none;
      }
      .sheet {
        border: none;
        width: 100%;
        padding: 12mm;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" onclick="window.print()">Print QR Anchor Sheet</button>
    <a class="btn secondary" href="./">Back to Game Suite</a>
  </div>

  <main class="sheet">
    <div class="title">Tabletop AR Board Anchor</div>
    <div class="subtitle">
      Place this printed QR code flat in the center of your table.
      Every player points their phone camera at it to anchor the shared 3D playing board.
    </div>

    <div class="qr-frame">
      <div id="anchorQr" class="qr-box">Generating QR...</div>
    </div>

    <div class="footer-note">
      Anchor ID: <code id="anchorPayload">TABLETOP-AR-ANCHOR-V1</code> • Keep flat &amp; well-lit for best tracking
    </div>
  </main>

  <script type="module">
    import { qrcode } from './vendor/qrcode/qrcode.mjs';
    const payload = 'TABLETOP-AR-ANCHOR-V1';
    const qr = qrcode(0, 'H');
    qr.addData(payload);
    qr.make();
    document.getElementById('anchorQr').innerHTML = qr.createSvgTag({ scalable: true, margin: 2 });
  </script>
</body>
</html>
